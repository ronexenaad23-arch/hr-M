<title>الموارد الطبية - HR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#root{min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#00BDB4}
input,select,textarea,button{font-family:inherit}
select option{background:#111827;color:#fff}
@media(max-width:768px){table{font-size:11px!important}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;flex-direction:column;gap:16px">
    <div style="width:48px;height:48px;border:3px solid #00BDB4;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <img src="/icon-192.png" style="width:60px;height:60px;border-radius:14px;margin-top:8px" onerror="this.style.display='none'"/>
    <p style="color:#00BDB4;font-size:17px;font-weight:700;margin:0">الموارد الطبية</p>
    <p style="color:#555;font-size:12px;margin:0">HR System</p>
  </div>
</div>
<script>
(function(){
  var VER='hr-v6.1-2026-07-28';
  if(localStorage.getItem('__hr_ver')!==VER){
    var keep=['__hr_ver','hr_session','hr_theme','hr_lang','hr_notes','hr_reminders'];
    Object.keys(localStorage).filter(function(k){
      return k.startsWith('hr_')&&keep.indexOf(k)===-1;
    }).forEach(function(k){localStorage.removeItem(k);});
    localStorage.setItem('__hr_ver',VER);
  }
})();
/* PWA: capture install prompt immediately */
window.__pwaPrompt=null;
window.__pwaInstalled=
  window.matchMedia('(display-mode:standalone)').matches||
  navigator.standalone===true||
  document.referrer.includes('android-app://');
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  window.__pwaPrompt=e;
  window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
  console.log('[PWA] ✅ Install prompt ready!');
});
window.addEventListener('appinstalled',function(){
  window.__pwaPrompt=null;
  window.__pwaInstalled=true;
  window.dispatchEvent(new CustomEvent('pwa-installed'));
  console.log('[PWA] ✅ Installed!');
});
/* Service Worker */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js',{scope:'/'})
      .then(function(r){
        console.log('[SW] ✅',r.scope);
        r.update();
      }).catch(function(e){console.warn('[SW]',e);});
  });
}
</script>
<script src="/app.js"></script>
</body>
</html>
