<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#00BDB4}
input,select,textarea,button{font-family:inherit}
select option{background:#111827;color:#fff}
@media(max-width:768px){table{font-size:11px!important}h2{font-size:16px!important}}
@keyframes spin{to{transform:rotate(360deg)}}

<body>
<div id="root">
  <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#050505;flex-direction:column;gap:16px;font-family:sans-serif">
    <div style="width:48px;height:48px;border:3px solid #00BDB4;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <img src="/icon-192.png" style="width:56px;height:56px;border-radius:14px;margin-top:4px" onerror="this.style.display='none'"/>
    <p style="color:#00BDB4;font-size:17px;font-weight:700;margin:0">&#x627;&#x644;&#x645;&#x648;&#x627;&#x631;&#x62F; &#x627;&#x644;&#x637;&#x628;&#x64A;&#x629;</p>
    <p style="color:#555;font-size:12px;margin:0">HR System v6.1</p>
  </div>
</div>
<script>
/* ── Force clear old SW caches then reload ── */
(function(){
  var VER = 'hr-v6.1-2026-09-07';
  var stored = localStorage.getItem('__hr_ver');
  if(stored !== VER){
    /* Clear old employee/pharmacy data but keep user prefs */
    var keep = ['__hr_ver','hr_session','hr_theme','hr_lang',
                'hr_notes','hr_reminders','hr_requests'];
    Object.keys(localStorage).forEach(function(k){
      if(k.startsWith('hr_') && keep.indexOf(k) === -1){
        localStorage.removeItem(k);
      }
    });
    localStorage.setItem('__hr_ver', VER);
    /* Clear old service worker caches */
    if('caches' in window){
      caches.keys().then(function(names){
        names.forEach(function(name){ caches.delete(name); });
      });
    }
  }
})();

/* ── PWA install prompt ── */
window.__pwaPrompt = null;
window.__pwaInstalled =
  window.matchMedia('(display-mode: standalone)').matches ||
  navigator.standalone === true;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  window.__pwaPrompt = e;
  window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
});
window.addEventListener('appinstalled', function(){
  window.__pwaPrompt = null;
  window.__pwaInstalled = true;
  window.dispatchEvent(new CustomEvent('pwa-installed'));
});

/* ── Service Worker ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    /* First unregister old SW to force fresh start */
    navigator.serviceWorker.getRegistrations().then(function(regs){
      var unregPromises = regs.map(function(r){ return r.unregister(); });
      return Promise.all(unregPromises);
    }).then(function(){
      /* Register fresh SW */
      return navigator.serviceWorker.register('/sw.js', {scope:'/'});
    }).then(function(reg){
      console.log('[SW] Fresh registration:', reg.scope);
    }).catch(function(e){
      console.warn('[SW] Failed:', e);
    });
  });
}
</script>
<script src="/app.js?v=20260907"></script>
